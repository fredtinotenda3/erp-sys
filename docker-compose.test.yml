# Throwaway local PostgreSQL for the automated test suite.
#
#   npm run test:db:up      start it
#   npm run test:db:setup   create roles + schema + grants (idempotent)
#   npm test                run the suite against it
#   npm run test:db:down    stop it and delete its data
#
# Why local: the suite is hundreds of multi-statement transactions that create real,
# permanent rows (audit_log is append-only, so tests cannot clean up after themselves).
# Against a remote database every statement pays the network round trip, which turned a
# few-minute run into 90 minutes of timeouts, and the test organizations piled up in
# the database used for demos. Here the data lives in RAM and vanishes with `down`.
services:
  postgres-test:
    image: postgres:16
    container_name: operis-postgres-test
    ports:
      - "54329:5432"
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: postgres
    # Data in RAM: faster, and `down` leaves nothing behind.
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
